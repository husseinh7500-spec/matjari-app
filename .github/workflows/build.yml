
name: Build StoreX Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract StoreX Project
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "StoreX-Windows-Project*.zip" -File | Select-Object -First 1

          if (-not $zip) {
            throw "StoreX ZIP file not found in repository root."
          }

          Expand-Archive -LiteralPath $zip.FullName -DestinationPath . -Force

          Write-Host "Extracted project files:"
          Get-ChildItem -Path . -Recurse -Filter package.json | Select-Object -ExpandProperty FullName

          if (-not (Test-Path "./StoreX-Windows/package.json")) {
            throw "StoreX-Windows/package.json not found. Check ZIP folder structure."
          }

      - name: Install Dependencies
        working-directory: ./StoreX-Windows
        run: npm install

      - name: Build StoreX EXE
        working-directory: ./StoreX-Windows
        run: npm run build:win

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: StoreX-Windows-Installer
          path: StoreX-Windows/release/*.exe
          if-no-files-found: error
          retention-days: 30
