name: Build Windows App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install
      working-directory: ./matjari-windows   # <--- أضف هذا السطر هنا

    - name: Build Electron App
      run: npx electron-builder --win --x64
      working-directory: ./matjari-windows   # <--- وأضف هذا السطر هنا أيضا
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifacts (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe-app
        path: "**/dist/*.exe"                # <--- تم تحديث المسار للبحث داخل المجلد الفرعي
