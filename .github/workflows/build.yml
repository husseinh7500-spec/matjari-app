
name: Build StoreX Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract StoreX Project
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path . -Filter "StoreX-Windows-Project*.zip" | Select-Object -First 1

          if (-not $archive) {
            throw "StoreX project ZIP was not found."
          }

          Expand-Archive -LiteralPath $archive.FullName -DestinationPath . -Force

          if (-not (Test-Path "StoreX-Windows/package.json")) {
            throw "package.json was not found after extraction."
          }

      - name: Install Dependencies
        run: npm --prefix StoreX-Windows install

      - name: Build StoreX EXE
        run: npm --prefix StoreX-Windows run build:win

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: StoreX-Windows-Installer
          path: StoreX-Windows/release/*.exe
          if-no-files-found: error
          retention-days: 30
